# The directory in which the files are stored locally
file.storage.local-path = "plume-file-data/"

# Files stored on disk are encrypted by default (AES-GCM).
# To store files unencrypted, set this to true.
file.storage.encryption.disabled = false

# The Base64 encoded AES-256 key (exactly 32 bytes once decoded) used to encrypt the files.
# This value is required when encryption is enabled. Any key that is not exactly 32 bytes long
# (in particular any shorter key) is rejected at startup.
# The key must be randomly generated and kept secret, for example with:
#   openssl rand -base64 32
# file.storage.encryption.key = "base64-encoded-aes-key"
