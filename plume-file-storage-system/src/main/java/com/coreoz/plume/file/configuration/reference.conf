# The directory in which the files are stored locally
file.storage.local-path = "plume-file-data/"

# Files stored on disk are encrypted by default (AES-GCM).
# To store files unencrypted, set this to true.
file.storage.encryption.disabled = false

# The Base64 encoded AES key (16, 24 or 32 bytes once decoded) used to encrypt the files.
# This value is required when encryption is enabled.
# file.storage.encryption.key = "base64-encoded-aes-key"
